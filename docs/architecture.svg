  <text x="806" y="209" text-anchor="middle" fill="#57606a" font-size="9.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">128</text>
</g>
<g>
  <rect x="894.0" y="86.0" width="8" height="40" fill="#ddf4ff" stroke="#0969da" stroke-width="1"/>
  <text x="898" y="194" text-anchor="middle" fill="#1f2328" font-size="10.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">Dense</text>
  <text x="898" y="209" text-anchor="middle" fill="#57606a" font-size="9.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">26 (output)</text>
</g>
  <text x="484" y="226" text-anchor="middle" fill="#57606a" font-size="9.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">Every convolution is followed by batch normalisation; each pooling block ends with dropout.</text>
</svg>
